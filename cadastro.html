<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro</title>

    <link rel="stylesheet" href="css/style.css">
</head>
<body>

     <div class="container">

        <!-- Lado esquerdo -->
        <div class="left">

            <div class="logo">
                <span>Ideia Futura</span>
            </div>

            <h1>
                Sua ideia pode <br>
                mudar o futuro
            </h1>

            <p>
                Crie sua conta e comece a compartilhar <br>
                explorar e transformar ideias em <br>
                projetos reais
            </p>

            <img src="img/imagem1.png" alt="Imagem do sistema" class="imagem-login">

        </div>

        <!-- Lado direito -->
        <div class="right">

            <div class="card">

                <h2>Crie sua conta</h2>

                <p>Preencha os dados para se cadastrar</p>

                <form>

                    <label><b>Nome de usuário</b></label>

                    <div class="input-box">
                        <i class="fa-regular fa-user"></i>

                        <input
                            type="text"
                            id="usuario"
                            name="usuario"
                            placeholder="Digite seu nome de usuário">
                    </div>

                    <label><b>E-mail</b></label>

                    <div class="input-box">
                        <i class="fa-regular fa-envelope"></i>

                        <input
                            type="email"
                            placeholder="Digite seu e-mail">
                    </div>

                    <label><b>Senha</b></label>

                    <div class="input-box">

                        <i class="fa-solid fa-lock"></i>

                        <input
                            type="password"
                            placeholder="Digite sua senha">

                        <i class="fa-regular fa-eye"></i>

                    </div>

                    <label><b> Confirme sua Senha</b></label>

                    <div class="input-box">

                        <i class="fa-solid fa-lock"></i>

                        <input
                            type="password"
                            placeholder="Confirme sua senha">

                        <i class="fa-regular fa-eye"></i>

                    </div>

                    
                    <button type="submit">
                        Entrar
                    </button>

                    <div class="divisa"></div>

                </form>

                <div class="register">
                    Já tem uma conta?
                   <a href="index.html"> Faça login</a>

                </div>

            </div>

        </div>

    </div>
    
    <script src="js/scripts.js"></script>
</body>
</html>
