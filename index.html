<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ideia Futura</title>

    <link rel="stylesheet" href="style.css">

    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>

<body>

    <div class="container">

        <!-- Lado esquerdo -->
        <div class="left">

            <div class="logo">
                <span>Ideia Futura</span>
            </div>

            <h1>
                Transforme ideias <br>
                em realidade
            </h1>

            <p>
                Compartilhe conceitos, inspire pessoas <br>
                e dê uma nova chance às boas ideias.
            </p>

            <img src="imagem1.png" alt="Imagem do sistema" class="imagem-login">

        </div>

        <!-- Lado direito -->
        <div class="right">

            <div class="card">

                <h2>Bem-vindo de volta!</h2>

                <p>Faça login para continuar no <b>Ideia Futura</b></p>

                <form>

                    <label><b>Email</b></label>

                    <div class="input-box">
                        <i class="fa-regular fa-envelope"></i>

                        <input
                            type="email"
                            placeholder="Digite seu e-mail">
                    </div>

                    <label><b>Senha</b></label>

                    <div class="input-box">

                        <i class="fa-solid fa-lock"></i>

                        <input
                            type="password"
                            placeholder="Digite sua senha">

                        <i class="fa-regular fa-eye"></i>

                    </div>

                    <a href="#" class="forgot">
                        Esqueceu sua senha?
                    </a>

                    <button type="submit">
                        Entrar
                    </button>

                </form>

                <div class="register">
                    Não tem login?
                    <a href="#">Cadastre-se</a>
                </div>

            </div>

        </div>

    </div>

</body>
</html>
